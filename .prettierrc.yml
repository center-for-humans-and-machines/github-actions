# Prettier configuration shared by pre-commit, Super-Linter (*_PRETTIER) and
# editors (esbenp.prettier-vscode). Mirrors rodrigobdz/linters.
printWidth: 80
tabWidth: 2
singleQuote: false
trailingComma: none
bracketSpacing: true
semi: true
useTabs: false
proseWrap: preserve
arrowParens: avoid
htmlWhitespaceSensitivity: css
endOfLine: lf
quoteProps: as-needed
overrides:
  - files:
      - "*.yml"
      - "*.yaml"
    options:
      # Matches yamllint's `braces` rule.
      bracketSpacing: false
